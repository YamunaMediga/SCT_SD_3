<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku Solver Game</title>
    <style>
        :root {
            color-scheme: dark;

            --bg-1: #020617;
            --bg-2: #0f172a;
            --bg-3: #172554;

            --panel: rgba(15, 23, 42, 0.82);

            --accent: #38bdf8;
            --accent-2: #818cf8;
            --accent-3: #a78bfa;

            --text: #f8fafc;
            --muted: #94a3b8;

            --border: #334155;
            --grid-border: #64748b;

            --success: #34d399;
            --danger: #fb7185;

            --cell-bg: #f8fafc;
            --cell-hover: #e0f2fe;
            --cell-focus: #bae6fd;

            --shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);

            --glow:
                0 0 30px rgba(56, 189, 248, 0.18);
        }




        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            display: grid;
            place-items: center;

            padding: 30px 20px;

            background:
                radial-gradient(circle at 10% 20%,
                    rgba(56, 189, 248, 0.14),
                    transparent 30%),
                radial-gradient(circle at 90% 80%,
                    rgba(129, 140, 248, 0.16),
                    transparent 30%),
                linear-gradient(135deg,
                    var(--bg-1),
                    var(--bg-2),
                    var(--bg-3));

            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* ===============================
       BACKGROUND DECORATION
       =============================== */

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.22;

            pointer-events: none;

            z-index: -1;
        }

        body::before {
            top: -100px;
            left: -80px;

            background: #38bdf8;

            animation: floatOne 8s ease-in-out infinite;
        }

        body::after {
            bottom: -100px;
            right: -80px;

            background: #8b5cf6;

            animation: floatTwo 10s ease-in-out infinite;
        }


        .app {
            width: min(100%, 780px);

            padding: 32px;

            position: relative;

            background:
                linear-gradient(145deg,
                    rgba(30, 41, 59, 0.82),
                    rgba(15, 23, 42, 0.92));

            border: 1px solid rgba(255, 255, 255, 0.10);

            border-radius: 28px;

            box-shadow:
                var(--shadow),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            animation: appAppear 0.7s ease-out;
        }



        .app::before {
            content: "";

            position: absolute;

            top: 0;
            left: 12%;

            width: 76%;
            height: 2px;

            border-radius: 999px;

            background:
                linear-gradient(90deg,
                    transparent,
                    var(--accent),
                    var(--accent-3),
                    transparent);

            box-shadow:
                0 0 18px rgba(56, 189, 248, 0.6);
        }




        h1 {
            margin: 0;

            text-align: center;

            font-size: clamp(2rem, 5vw, 3rem);

            font-weight: 800;

            letter-spacing: -1px;

            background:
                linear-gradient(90deg,
                    #f8fafc,
                    #7dd3fc,
                    #a5b4fc,
                    #f8fafc);

            background-size: 200% auto;

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                titleShine 5s linear infinite;
        }


        p {
            margin: 10px auto 24px;

            max-width: 560px;

            text-align: center;

            color: var(--muted);

            font-size: 0.95rem;

            line-height: 1.6;
        }




        .level-group {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 18px;
        }


        button {
            position: relative;

            border: 1px solid transparent;

            border-radius: 999px;

            padding: 11px 20px;

            font-size: 0.92rem;

            font-weight: 700;

            letter-spacing: 0.2px;

            cursor: pointer;

            color: white;

            background:
                linear-gradient(135deg,
                    var(--accent),
                    var(--accent-2));

            box-shadow:
                0 8px 20px rgba(56, 189, 248, 0.15);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }


        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 28px rgba(56, 189, 248, 0.28);
        }


        button:active {
            transform: translateY(0) scale(0.96);
        }


        button:focus-visible {
            outline: 3px solid rgba(56, 189, 248, 0.35);

            outline-offset: 3px;
        }


        button.secondary {
            color: #cbd5e1;

            background:
                rgba(51, 65, 85, 0.75);

            border-color:
                rgba(148, 163, 184, 0.15);

            box-shadow: none;
        }


        button.secondary:hover {
            background:
                rgba(71, 85, 105, 0.95);

            color: white;
        }


        button.active-level {
            color: white;

            background:
                linear-gradient(135deg,
                    #34d399,
                    #14b8a6);

            border-color:
                rgba(167, 243, 208, 0.25);

            box-shadow:
                0 8px 25px rgba(20, 184, 166, 0.28);
        }



        .controls {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 12px;

            margin-bottom: 16px;
        }


        #solve-btn {
            min-width: 150px;

            background:
                linear-gradient(135deg,
                    #38bdf8,
                    #6366f1);
        }


        #solve-btn::before {
            content: "✦";

            margin-right: 7px;

            font-size: 0.9rem;
        }


        #clear-btn::before {
            content: "↻";

            margin-right: 7px;

            font-size: 1rem;
        }


        .status {
            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 34px;

            margin: 10px 0 18px;

            color: var(--muted);

            font-size: 0.92rem;

            font-weight: 600;

            text-align: center;

            transition:
                color 0.3s ease,
                transform 0.3s ease;
        }


        .status.success {
            color: var(--success);

            animation: statusPop 0.45s ease;
        }


        .status.error {
            color: var(--danger);

            animation: statusShake 0.4s ease;
        }



        .board {
            display: grid;

            grid-template-columns:
                repeat(9, 1fr);

            width: min(100%, 540px);

            margin: 0 auto;

            overflow: hidden;

            background: #0f172a;

            border:
                3px solid var(--grid-border);

            border-radius: 14px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.04);

            animation: boardAppear 0.6s ease-out;
        }


        .cell {
            width: 100%;

            aspect-ratio: 1;

            border: 1px solid #cbd5e1;

            outline: none;

            text-align: center;

            font-size: clamp(1rem, 3vw, 1.35rem);

            font-weight: 750;

            color: #0f172a;

            background:
                linear-gradient(145deg,
                    #ffffff,
                    #f1f5f9);

            padding: 0;

            cursor: text;

            transition:
                background 0.18s ease,
                color 0.18s ease,
                transform 0.12s ease,
                box-shadow 0.18s ease;
        }




        .cell:hover {
            background:
                #e0f2fe;

            box-shadow:
                inset 0 0 0 2px rgba(56, 189, 248, 0.35);

            position: relative;

            z-index: 2;
        }




        .cell:focus {
            background:
                #bae6fd;

            color: #0c4a6e;

            box-shadow:
                inset 0 0 0 3px #38bdf8,
                0 0 15px rgba(56, 189, 248, 0.25);

            transform: scale(0.96);

            position: relative;

            z-index: 3;
        }


        .cell.prefilled {
            background:
                linear-gradient(145deg,
                    #e2e8f0,
                    #f8fafc);

            color: #0f172a;

            font-weight: 800;

            cursor: default;
        }



        .cell:nth-child(3n) {
            border-right:
                3px solid var(--grid-border);
        }




        .cell:nth-child(9n) {
            border-right: none;
        }




        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {

            border-bottom:
                3px solid var(--grid-border);
        }




        .cell:not(:placeholder-shown) {
            animation: numberPop 0.18s ease-out;
        }


        @media (max-width: 600px) {

            body {
                padding: 15px;
            }


            .app {
                padding: 22px 14px;

                border-radius: 22px;
            }


            h1 {
                font-size: 2rem;
            }


            p {
                font-size: 0.85rem;

                margin-bottom: 20px;
            }


            .board {
                width: 100%;

                border-width: 2px;

                border-radius: 10px;
            }


            .cell {
                font-size: 1rem;
            }


            button {
                padding: 10px 15px;

                font-size: 0.85rem;
            }
        }


        @media (max-width: 380px) {

            .app {
                padding: 18px 10px;
            }


            .cell {
                font-size: 0.85rem;
            }


            .level-group,
            .controls {
                gap: 6px;
            }


            button {
                padding: 9px 12px;
            }
        }

        @keyframes appAppear {

            from {
                opacity: 0;

                transform:
                    translateY(20px) scale(0.98);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0) scale(1);
            }
        }


        @keyframes boardAppear {

            from {
                opacity: 0;

                transform:
                    scale(0.96);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }


        @keyframes titleShine {

            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 200% center;
            }
        }


        @keyframes numberPop {

            0% {
                transform: scale(0.8);

                opacity: 0.4;
            }

            100% {
                transform: scale(1);

                opacity: 1;
            }
        }


        @keyframes statusPop {

            0% {
                opacity: 0;

                transform: scale(0.9);
            }

            100% {
                opacity: 1;

                transform: scale(1);
            }
        }


        @keyframes statusShake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }


        @keyframes floatOne {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(40px, 30px);
            }
        }


        @keyframes floatTwo {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-35px, -25px);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <h1>Sudoku Solver Game</h1>
        <p>Fill the board with your puzzle, then press Solve. Empty cells can stay blank.</p>
        <p>
            Choose a difficulty, solve it yourself, or enter your own puzzle.
        </p>
        <div class="level-group" id="level-group">
            <button class="secondary active-level" data-level="easy">Easy</button>
            <button class="secondary" data-level="medium">Medium</button>
            <button class="secondary" data-level="hard">Hard</button>
        </div>

        <div class="controls">
            <button id="solve-btn">Solve Puzzle</button>
            <button id="clear-btn" class="secondary">Clear Board</button>
        </div>

        <div id="status" class="status">
            Choose a difficulty to begin.
        </div>
        <div id="board" class="board"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
